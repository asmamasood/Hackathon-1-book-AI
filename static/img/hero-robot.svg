<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern, minimalist humanoid robot illustration -->

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGradient)"/>

  <!-- Robot Body (Humanoid) -->
  <!-- Head -->
  <circle cx="300" cy="120" r="40" fill="url(#robotGradient)" stroke="#1E40AF" stroke-width="2"/>
  <circle cx="290" cy="115" r="5" fill="#FFFFFF"/>
  <circle cx="310" cy="115" r="5" fill="#FFFFFF"/>

  <!-- Torso -->
  <rect x="260" y="160" width="80" height="100" rx="10" fill="url(#robotGradient)" stroke="#1E40AF" stroke-width="2"/>

  <!-- Arms -->
  <rect x="220" y="170" width="35" height="80" rx="8" fill="url(#robotGradient)" stroke="#1E40AF" stroke-width="2"/>
  <rect x="345" y="170" width="35" height="80" rx="8" fill="url(#robotGradient)" stroke="#1E40AF" stroke-width="2"/>

  <!-- Legs -->
  <rect x="270" y="260" width="25" height="90" rx="6" fill="url(#robotGradient)" stroke="#1E40AF" stroke-width="2"/>
  <rect x="305" y="260" width="25" height="90" rx="6" fill="url(#robotGradient)" stroke="#1E40AF" stroke-width="2"/>

  <!-- Joints (circles at key points) -->
  <circle cx="237.5" cy="250" r="8" fill="#1E40AF"/>
  <circle cx="362.5" cy="250" r="8" fill="#1E40AF"/>
  <circle cx="282.5" cy="260" r="8" fill="#1E40AF"/>
  <circle cx="317.5" cy="260" r="8" fill="#1E40AF"/>

  <!-- Accent lines (technology theme) -->
  <line x1="280" y1="200" x2="320" y2="200" stroke="#60A5FA" stroke-width="2"/>
  <line x1="280" y1="220" x2="320" y2="220" stroke="#60A5FA" stroke-width="2"/>

  <!-- Energy/AI Symbol (chest) -->
  <circle cx="300" cy="210" r="12" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="300" cy="210" r="6" fill="#60A5FA"/>
</svg>
